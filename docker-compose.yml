version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: des-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: des_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - des-network

  redis:
    image: redis:7-alpine
    container_name: des-redis
    ports:
      - "6379:6379"
    networks:
      - des-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: des-backend
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=des_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - des-network

volumes:
  postgres_data:

networks:
  des-network:
    driver: bridge
